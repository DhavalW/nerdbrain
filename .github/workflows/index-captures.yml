name: index-captures

# A capture dropped into docs/references/ leaves the repo red until someone adds
# its `## Files` row and page map. That work is mechanical, so it runs here and
# arrives as a PR - dropping the PDF in is the whole job.
#
# Deterministic on purpose: no model, no credentials, nothing to configure. The
# draft still needs a human pass, which is why it opens a PR instead of pushing.

on:
  push:
    branches: [main]
    paths:
      - 'docs/references/**.pdf'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: index-captures
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Skips historical blob versions. It does NOT avoid the captures
          # themselves: autoindex has to see every PDF in the folder to know
          # which ones are missing an entry, so checking out the tip fetches
          # them. At depth 1 that is most of the cost either way.
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pymupdf

      - name: Draft index entries for unindexed captures
        run: python3 tools/autoindex.py

      - name: Open a PR with the drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing drafted - every capture was already indexed."
            exit 0
          fi

          branch="autoindex/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/
          git commit -m "docs: draft index entries for new captures"
          git push -u origin "$branch"

          gh pr create \
            --title "docs: draft index entries for new captures" \
            --body "$(cat <<'BODY'
          `tools/autoindex.py` found captures on disk that their index did not list, and
          drafted the `## Files` rows and a page map for each.

          **This is a draft, and the gate does not check the parts that matter here.**
          Before merging:

          - Merge the over-split rows. `index-pdf.py` splits on font size, so one topic
            often arrives as three.
          - Rename each topic the way the document names it. Packs cite topics by name, so
            a drifted heading breaks resolution silently.
          - An article-per-page capture wants `index-pdf.py --per-page` instead — redo the
            map that way if the draft is one row per page.
          - Record the source URL in the index if it isn't there yet.
          - Delete the `draft map, unreviewed` headings once the maps are real.

          Then run `python3 tools/check.py` and merge.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          BODY
          )"
